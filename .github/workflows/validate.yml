name: validate

# The whole value of this repo is that its description of the dashboard stays
# honest. These five checks are what enforce that, so they run on everything.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: pip install -r tools/requirements.txt

      - name: Ontology — schema, cross-references, status ledger
        run: python tools/validate_ontology.py

      - name: Catalog — capabilities, utterance collisions, THE READ-ONLY INVARIANT
        run: python tools/validate_catalog.py

      - name: Golden set — every id still resolves
        run: python tools/validate_golden.py

      - name: Sources — every declared field exists on its endpoint
        # Fails on a mapping the OpenAPI spec contradicts, and on a stale VERIFY.md.
        # Regenerate with: python tools/verify_sources.py --write
        run: python tools/verify_sources.py --check

      - name: Knowledge base — not stale
        # Regenerate with: python tools/render_kb.py
        run: python tools/render_kb.py --check

      - name: Nothing credential-shaped got committed
        # Two checks, because the first one alone is not enough — it matches on
        # FILENAMES, and a real Gemini key once reached a commit inside
        # .env.example, which is tracked on purpose and matches no filename rule.
        # GitHub push protection caught it; this job had not. Content is what counts.
        run: |
          set -e
          if git ls-files | grep -Ei '\.(jwt|token|pem)$|^\.env$|sweep-results.*\.json$'; then
            echo "::error::A credential or live-data file is tracked. See CONTRIBUTING.md §8."
            exit 1
          fi
          # Key SHAPES, in the content of every tracked text file. .env.example is
          # meant to carry variable NAMES with empty values — never a value.
          if git grep -nIE '(AIza[0-9A-Za-z_-]{30,}|AQ\.[0-9A-Za-z_-]{30,}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . ':(exclude).github/workflows/*'; then
            echo "::error::Something key-shaped is committed. Scrub it from history and ROTATE it — a pushed secret is a leaked secret."
            exit 1
          fi
          echo "clean"

  service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: service/requirements.txt

      - run: pip install -r service/requirements.txt

      - name: Service tests
        # Runs entirely against the stub responder — no API key, no network, no
        # tokens spent. CI must not depend on a third party's uptime.
        working-directory: service
        run: python -m pytest tests -q
