queries:

# ══════════════════════════════════════════════════════════════════════════
#  1. COLLISIONS  (g001-g028)
#  The words are ambiguous and the product genuinely means several things by
#  them. Getting these right is the whole argument for a follow-up model.
# ══════════════════════════════════════════════════════════════════════════

  - id: g001
    query: what's my wallet balance
    context: {screen: command_centre, role: AD_PARTNER_ADMIN}
    expect:
      capability: wallet.explain_balance
      mode: answer
      follow_up: which_wallet
      metrics: [main_wallet_balance, sub_wallet_total, total_credits_owned]
    why: >
      Three real answers and the Command Centre names none of them. Genie must ask,
      not guess. This is the worked example the whole follow-up model was built around.

  - id: g002
    query: what's my wallet balance
    context: {screen: wallet_management, role: AD_PARTNER_ADMIN}
    expect:
      capability: wallet.explain_balance
      mode: answer
      follow_up: null
      metrics: [main_wallet_balance]
    why: >
      Same words, same user, different screen - and now the question must NOT be asked,
      because the screen already separates the three. g001 and g002 differ only in
      context, which is exactly the property worth testing.

  - id: g003
    query: how much money do I have
    context: {screen: command_centre, role: CAMPAIGN_MANAGER}
    expect:
      capability: wallet.explain_balance
      mode: answer
      follow_up: which_wallet
      metrics: [user_subwallet_balance, main_wallet_balance]
    why: >
      A campaign manager spends from their OWN sub-wallet, so "my balance" most likely
      means that. The options must be REORDERED by role, not merely filtered.

  - id: g004
    query: how many screens do I have
    context: {screen: command_centre, role: AD_PARTNER_ADMIN}
    expect:
      capability: inventory.explain_screens
      mode: answer
      follow_up: which_screen_count
      metrics: [owned_screens, active_screens, targeting_capable_screens]
    why: >
      R8. Four concepts - contracted, live, targeting-capable, in use. The likeliest
      question on the whole dashboard and the one with the most ways to be wrong.

  - id: g005
    query: how many screens do I have
    context: {screen: inventory_management, role: AD_PARTNER_ADMIN}
    expect:
      capability: inventory.explain_screens
      mode: answer
      follow_up: null
      metrics: [owned_screens]
    why: Inventory Management shows all four side by side, so the question is already answered.

  - id: g006
    query: what's my utilisation
    context: {screen: command_centre, role: AD_PARTNER_ADMIN}
    expect:
      capability: explain.metric
      mode: answer
      follow_up: which_utilization
      metrics: [monthly_spot_inventory_utilised]
    why: >
      Budget utilisation and inventory utilisation are different quantities with near
      identical names. They score within noise on any embedding model - this is the
      case that proves definitions must never come from a vector search.

  - id: g007
    query: what does utilization mean
    context: {screen: campaign_detail, role: AD_PARTNER_ADMIN}
    expect:
      capability: explain.metric
      mode: answer
      follow_up: null
      metrics: []
    why: >
      Same ambiguous word, but Campaign Detail is about one campaign's budget, so the
      screen resolves it. Also tests the American spelling.

  - id: g008
    query: what's my reach
    context: {screen: command_centre, role: AD_PARTNER_ADMIN}
    expect:
      capability: explain.metric
      mode: answer
      follow_up: which_reach
      metrics: [network_reach, monthly_reach]
      honest_gap: true
      gap_kind: unserved
    why: >
      R12. The platform computes four things called reach and only one is window-unique.
      Still asks WHICH, because the definitions are served even though the numbers are not -
      an ontology lookup needs no endpoint. Then says the figure is unavailable to an ad
      partner: contract v3.1 section 5 scopes the audience window to store owners.
      Asking and then declining is the right order; declining without asking tells the
      user less than it could.

  - id: g009
    query: show me attention
    context: {screen: command_centre, role: AD_PARTNER_ADMIN}
    expect:
      capability: explain.metric
      mode: answer
      follow_up: which_attention
      metrics: [avg_attention, avg_dwell]
    why: >
      R1 and R16. Attention is a 0-1 ratio; dwell is seconds. One screen labels dwell
      as attention. A ratio and a duration are not interchangeable.

  - id: g010
    query: how many impressions did we serve
    context: {screen: command_centre, role: AD_PARTNER_ADMIN}
    expect:
      capability: explain.metric
      mode: answer
      follow_up: null
      metrics: [impressions_delivered]
    why: >
      R18 - four names for one thing, now one name. No follow-up: the variants all
      resolve to the same metric, so asking would be noise.

  - id: g011
    query: what's the difference between reach and impressions
    context: {screen: command_centre, role: AD_PARTNER_ADMIN}
    expect:
      capability: explain.difference
      mode: answer
      follow_up: null
      metrics: []
    why: >
      Must route to difference, not metric. Impressions are playback events, reach is
      people, footfall is visits - saying so plainly prevents the next three wrong questions.

  - id: g012
    query: is footfall the same as impressions
    context: {screen: command_centre, role: AD_PARTNER_ADMIN}
    expect:
      capability: explain.difference
      mode: answer
      follow_up: null
      metrics: []
    why: >
      R10 and D7. "Camera footfall" on the deck means daily impressions over screen count -
      an average per screen - while the backend's footfall is visit events. Same word, two quantities.

  - id: g013
    query: how is my campaign doing
    context: {screen: campaign_detail, role: AD_PARTNER_ADMIN}
    expect:
      capability: campaign.explain_performance
      mode: answer
      follow_up: null
      metrics: [campaign_active_screens, campaign_time_elapsed]
      unavailable: [campaign_impressions, campaign_spend, campaign_percent_delivered]
      honest_gap: true
      gap_kind: unserved
    why: >
      The single most important honest-gap case. Per-campaign delivery is not served,
      so the answer is budget, state, screens and elapsed time, plus a plain statement
      that impressions and spend-to-date are not available per campaign. Quoting the
      committed budget as spend would overstate every unfinished campaign.

  - id: g014
    query: how is my campaign doing
    context: {screen: command_centre, role: AD_PARTNER_ADMIN}
    expect:
      capability: campaign.explain_performance
      mode: answer
      follow_up: which_campaign
      metrics: []
      unavailable: [campaign_impressions, campaign_spend]
      honest_gap: true
      gap_kind: unserved
    why: No campaign in context, so it must ask which - before explaining the gap.

  - id: g015
    query: which brand is performing best
    context: {screen: command_centre, role: AD_PARTNER_ADMIN}
    expect:
      capability: brand.explain_performance
      mode: answer
      follow_up: brand_perf_window
      metrics: [top_brands, brand_booked_revenue]
    why: >
      "Best" needs a period before it means anything, and the Command Centre carries
      no date range. Tests a scope follow-up rather than a disambiguation.

  - id: g016
    query: how many campaigns do I have
    context: {screen: command_centre, role: AD_PARTNER_ADMIN}
    expect:
      capability: campaign.list
      mode: answer
      follow_up: which_state
      metrics: [active_campaigns]
    why: >
      R17. Live, scheduled, draft and completed are all "campaigns I have". Counting
      drafts as live would misreport the business.

  - id: g017
    query: how full are my screens
    context: {screen: inventory_management, role: AD_PARTNER_ADMIN}
    expect:
      capability: inventory.explain_occupancy
      mode: answer
      follow_up: null
      metrics: [monthly_spot_inventory_utilised, daypart_occupancy]
    why: >
      Occupancy, not screen count - the near neighbour is inventory.explain_screens
      and they answer different questions.

  - id: g018
    query: what's my fill rate
    context: {screen: inventory_management, role: AD_PARTNER_ADMIN}
    expect:
      capability: inventory.explain_occupancy
      mode: answer
      follow_up: null
      metrics: [fill_rate_by_section]
    why: Different words, same capability as g017. Tests utterance coverage, not routing.

  - id: g019
    query: what does a screen cost
    context: {screen: inventory_management, role: AD_PARTNER_ADMIN}
    expect:
      capability: inventory.explain_rates
      mode: answer
      follow_up: null
      metrics: [avg_broadcasting_cpm, avg_targeting_cpm]
    why: >
      Must never surface the AdGrid-to-AdPartner breakdown, which is the agency's own
      cost basis and marked internal.

  - id: g020
    query: why is targeted more expensive
    context: {screen: inventory_management, role: AD_PARTNER_ADMIN}
    expect:
      capability: inventory.explain_rates
      mode: answer
      follow_up: null
      metrics: [avg_targeted_cpm, avg_broadcasting_cpm]
    why: >
      A "why" question that is still rates, not concept. The floor is Base x Audience x
      Context x Format x Day-part, and the auction clears above it only under competition.

  - id: g021
    query: how long will my budget last
    context: {screen: command_centre, role: AD_PARTNER_ADMIN}
    expect:
      capability: wallet.explain_runway
      mode: answer
      follow_up: null
      metrics: [wallet_runway_days, wallet_runway_projection]
    why: >
      R32. The backend returns runwayMONTHS while the deck's alert strip says days.
      Genie reports the API's unit. An admin has no sub-wallet, so no follow-up fires.

  - id: g022
    query: how long will my budget last
    context: {screen: command_centre, role: CAMPAIGN_MANAGER}
    expect:
      capability: wallet.explain_runway
      mode: answer
      follow_up: whose_runway
      metrics: [wallet_runway_days, user_subwallet_balance]
    why: >
      Same words as g021, different role, and now "my" is genuinely ambiguous because
      this user has a sub-wallet of their own. Role changes whether a follow-up fires.

  - id: g023
    query: where are my screens
    context: {screen: inventory_management, role: AD_PARTNER_ADMIN}
    expect:
      capability: inventory.explain_distribution
      mode: answer
      follow_up: null
      metrics: [location_distribution, brand_screens_by_city]
    why: >
      Geography, not count. This utterance previously collided with two capabilities
      and the validator caught it - keep it pinned.

  - id: g024
    query: show me my creatives
    context: {screen: creative_library, role: AD_PARTNER_ADMIN}
    expect:
      capability: creative.explain_library
      mode: answer
      follow_up: null
      metrics: [creatives_total, creatives_approved, creatives_pending_review]
    why: Library contents, not the navigate capability, because the user is already there.

  - id: g025
    query: take me to my creatives
    context: {screen: command_centre, role: AD_PARTNER_ADMIN}
    expect:
      capability: navigate.creatives
      mode: navigate
      follow_up: which_brand_library
      metrics: []
    why: >
      Nearly the same words as g024, opposite intent. "Take me to" is navigation;
      "show me" from inside the screen is a read.

  - id: g026
    query: what's my share of voice
    context: {screen: command_centre, role: AD_PARTNER_ADMIN}
    expect:
      capability: explain.metric
      mode: answer
      follow_up: null
      metrics: [share_of_voice]
    why: >
      Share of voice does not move with anyone else's buying - a client's share of a
      screen is fixed when its contract starts. A generic answer about competition would be wrong.

  - id: g027
    query: how many people saw my ads last month
    context: {screen: command_centre, role: AD_PARTNER_ADMIN}
    expect:
      capability: explain.metric
      mode: answer
      follow_up: null
      metrics: [monthly_reach]
      honest_gap: true
      gap_kind: unserved
    why: >
      "People" rules out impressions and "last month" fixes the window, so no follow-up -
      and then the honest answer, because window-unique reach is computed for store owners
      only. The trap is `reach` on the content endpoint, which IS served but is the largest
      SINGLE DAY and explicitly not summable. Multiplying it by thirty would double-count
      every returning visitor and is the most plausible wrong answer here.

  - id: g028
    query: what's my verified impression rate
    context: {screen: command_centre, role: AD_PARTNER_ADMIN}
    expect:
      capability: explain.metric
      mode: answer
      follow_up: null
      metrics: [verified_impressions]
      honest_gap: true
      gap_kind: unserved
    why: >
      R16 - the term is real and defined, but nothing serves it. Genie explains what it
      means and says the number is not available. Definition and data are separate things.

# ══════════════════════════════════════════════════════════════════════════
#  2. DEFINITIONS AND CONCEPTS  (g029-g043)
# ══════════════════════════════════════════════════════════════════════════

  - id: g029
    query: what is a daypart
    context: {screen: launch_campaign, role: AD_PARTNER_ADMIN}
    expect: {capability: explain.concept, mode: answer, follow_up: null, metrics: []}
    why: R2 and D1 - four 3-hour bands from 10:00 to 22:00, not the deck's continuous range.

  - id: g030
    query: how does targeted pricing work
    context: {screen: inventory_management, role: AD_PARTNER_ADMIN}
    expect: {capability: explain.concept, mode: answer, follow_up: null, metrics: []}
    why: >
      An exact answer exists - Base x Audience x Context x Format x Day-part, second
      price. Use it rather than paraphrasing.

  - id: g031
    query: when does money leave my wallet
    context: {screen: wallet_management, role: AD_PARTNER_ADMIN}
    expect: {capability: explain.concept, mode: answer, follow_up: null, metrics: []}
    why: >
      R22 and D5. Broadcast debits at OTP verify, base plus 18% GST on the AdGrid leg.
      Targeted is postpaid and takes nothing at confirm. Getting this wrong misstates cash.

  - id: g032
    query: what does maker-checker mean
    context: {screen: notifications_approvals, role: CAMPAIGN_MANAGER}
    expect: {capability: explain.concept, mode: answer, follow_up: null, metrics: []}
    why: R21 - the manager submits, the admin activates. Explained to the role that is the maker.

  - id: g033
    query: why do I need an OTP
    context: {screen: wallet_management, role: AD_PARTNER_ADMIN}
    expect: {capability: explain.concept, mode: answer, follow_up: null, metrics: []}
    why: Nine open-service domains are OTP-gated. This is also the ground for every refusal.

  - id: g034
    query: broadcasting vs targeted
    context: {screen: launch_campaign, role: AD_PARTNER_ADMIN}
    expect: {capability: explain.difference, mode: answer, follow_up: null, metrics: []}
    why: >
      The two selling motions differ in booking, billing and inventory. Reserved SOV at
      a fixed CPM versus a postpaid auction on camera screens.

  - id: g035
    query: premium or standard - what changes
    context: {screen: inventory_management, role: AD_PARTNER_ADMIN}
    expect: {capability: explain.difference, mode: answer, follow_up: null, metrics: []}
    why: >
      R3 - 120-second loop against 60-second. R8 - it is a commercial model, never a
      screen count, and must not appear as a headline metric.

  - id: g036
    query: how is dwell different from attention
    context: {screen: command_centre, role: AD_PARTNER_ADMIN}
    expect: {capability: explain.difference, mode: answer, follow_up: null, metrics: []}
    why: >
      Same pair as g009, but asked as a comparison. Must route to difference and must
      NOT fire the which_attention follow-up, because the question already names both.

  - id: g037
    query: rev-share versus rental
    context: {screen: brand_management, role: AD_PARTNER_ADMIN}
    expect: {capability: explain.difference, mode: answer, follow_up: null, metrics: []}
    why: Two commercial models on the brand rows. Business vocabulary, no metric attached.

  - id: g038
    query: what's the formula for gross profit
    context: {screen: command_centre, role: AD_PARTNER_ADMIN}
    expect:
      capability: explain.metric
      mode: answer
      follow_up: null
      metrics: [gross_profit, gross_billing]
    why: Asks for a formula specifically, so the answer must include it, not just the definition.

  - id: g039
    query: what am I looking at
    context: {screen: inventory_management, role: AD_PARTNER_ADMIN}
    expect: {capability: explain.screen, mode: answer, follow_up: null, metrics: []}
    why: Pure screen awareness. The answer is meaningless without context.

  - id: g040
    query: what can I do here
    context: {screen: wallet_management, role: CAMPAIGN_MANAGER}
    expect: {capability: explain.screen, mode: answer, follow_up: null, metrics: []}
    why: >
      R6 - a campaign manager has no wallet permission, so Top up and Settle must not
      be offered. Screen explanation filtered by role.

  - id: g041
    query: what can you do
    context: {screen: command_centre, role: CAMPAIGN_MANAGER}
    expect: {capability: explain.capabilities, mode: answer, follow_up: null, metrics: []}
    why: >
      The catalog filtered by role. A campaign manager must not be told about Team
      Management, which is not in their nav.

  - id: g042
    query: can you create campaigns
    context: {screen: command_centre, role: AD_PARTNER_ADMIN}
    expect: {capability: explain.capabilities, mode: answer, follow_up: null, metrics: []}
    why: >
      Must be specific about the limit: Genie plans and fills the wizard, the human
      submits. "I can help with campaigns" is a worse answer than the true one.

  - id: g043
    query: why can't you tell me that
    context: {screen: campaign_detail, role: AD_PARTNER_ADMIN}
    expect:
      capability: explain.why_unavailable
      mode: answer
      follow_up: null
      metrics: []
      unavailable: [campaign_impressions]
      honest_gap: true
      gap_kind: unserved
    why: >
      Asked ON Campaign Detail, so the thing Genie could not tell them is per-campaign
      delivery. Three different reasons deserve three different answers - definition disputed,
      data not served, or role cannot see it. Conflating them is unhelpful.

# ══════════════════════════════════════════════════════════════════════════
#  3. LIVE DATA  (g044-g060)
# ══════════════════════════════════════════════════════════════════════════

  - id: g044
    query: how much have we spent this month
    context: {screen: wallet_management, role: AD_PARTNER_ADMIN}
    expect:
      capability: wallet.explain_spending
      mode: answer
      follow_up: null
      metrics: [month_consumption]
    why: >
      "This month" fixes the window, so the scope follow-up must not fire. The answer
      must echo the resolved window back so a misread surfaces immediately.

  - id: g045
    query: where is my money going
    context: {screen: command_centre, role: AD_PARTNER_ADMIN}
    expect:
      capability: wallet.explain_spending
      mode: answer
      follow_up: spending_window
      metrics: [month_consumption, top_brands]
    why: No period stated and the Command Centre carries none, so the window must be asked for.

  - id: g046
    query: how much has each manager spent
    context: {screen: team_management, role: AD_PARTNER_ADMIN}
    expect:
      capability: wallet.explain_manager_wallets
      mode: answer
      follow_up: null
      metrics: [manager_allocated, manager_spent, manager_balance]
    why: >
      "Each" means all of them, so no entity follow-up. Balance may not equal allocated
      minus spent, because cancelled campaigns refund.

  - id: g047
    query: how much has Akshay spent
    context: {screen: team_management, role: AD_PARTNER_ADMIN}
    expect:
      capability: wallet.explain_manager_wallets
      mode: answer
      follow_up: which_manager
      metrics: [manager_spent]
    why: >
      A named entity that still needs resolving to a user id. Tests entity_choice on a
      name rather than on an empty slot.

  - id: g048
    query: who has budget left
    context: {screen: team_management, role: AD_PARTNER_ADMIN}
    expect:
      capability: wallet.explain_manager_wallets
      mode: answer
      follow_up: null
      metrics: [manager_balance]
    why: A filter over all managers, not a lookup of one. No follow-up.

  - id: g049
    query: how many brands do I manage
    context: {screen: brand_management, role: AD_PARTNER_ADMIN}
    expect:
      capability: brand.list
      mode: answer
      follow_up: null
      metrics: [brands_managed]
    why: >
      A count, not performance. Brands under an agency cannot create campaigns
      themselves, which is worth knowing when the follow-on question arrives.

  - id: g050
    query: how is Coca-Cola doing
    context: {screen: brand_management, role: AD_PARTNER_ADMIN}
    expect:
      capability: brand.explain_performance
      mode: answer
      follow_up: brand_perf_window
      metrics: [brand_live_campaigns, brand_daily_impressions, brand_booked_revenue]
    why: >
      Brand named so no entity question, but still no period. Booked revenue is
