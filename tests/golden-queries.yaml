                       # ─────────────────────────────────────────────────
                       #  GOLDEN QUERY SET
                       # ─────────────────────────────────────────────────
#
# 106 queries with the answer written down before the router exists, so S3 has
# an exit gate rather than a vibe. Every capability in the catalog has at least
# one - a capability nobody wrote a query for is one nobody has thought about. Every id here is cross-checked against the
# ontology and the catalog by tools/validate_golden.py, so a rename breaks the
# test set loudly instead of silently.
#
# Weighted deliberately. A third of these are collisions - the cases where two
# capabilities or two metrics are a plausible reading of the same words. Those
# are where an assistant is confidently wrong, and confidently wrong about a
# number on someone's screen is the failure that loses trust for good.
#
# FIELDS
#   query        what the user types
#   context      screen the user is on, and their role. Screen context is not
#                decoration - it SUPPRESSES follow-ups, which is most of the
#                value of being embedded rather than a chat window.
#   expect.capability   exactly one capability id
#   expect.mode         must match that capability's genie_mode
#   expect.follow_up    the follow-up that must fire, or null for none
#   expect.metrics      metric ids the answer must be built from
#   expect.refuses      true when Genie must decline and hand off
#   expect.honest_gap   true when the right answer is "I don't have that"
#   expect.gap_kind     WHICH kind, because they need different answers:
#                         unserved     nothing returns it - an API gap
#                         wrong_grain  it exists at another scope, not this one
#                         freshness    it exists, but not for the period asked
#                         suppressed   below the k-anonymity floor of 10. NOT zero
#                         withheld     served, but not this user's to see
#                         permission   the role cannot reach it
#                         isolation    another tenant's data
#                         out_of_scope not what Genie is for
#   expect.unavailable  metric ids Genie must explicitly decline, as opposed to
#                       expect.metrics, which is what it answers WITH
#   why          what this query is actually testing. If it has no distinct
#                reason to exist, it does not belong in the set.

