  - id: g051
    query: what's pending approval
    context: {screen: notifications_approvals, role: AD_PARTNER_ADMIN}
    expect:
      capability: campaign.list
      mode: answer
      follow_up: null
      metrics: [pending_approvals, budget_awaiting_approval, oldest_waiting]
    why: >
      Genie's most useful contribution on this screen is the summary: how many, whose,
      total budget, which is oldest.

  - id: g052
    query: can my managers afford what they've requested
    context: {screen: notifications_approvals, role: AD_PARTNER_ADMIN}
    expect:
      capability: wallet.explain_manager_wallets
      mode: answer
      follow_up: null
      metrics: [subwallet_sufficiency, manager_balance]
    why: >
      The single highest-value derived answer in the product - two real reads joined.
