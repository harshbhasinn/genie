    query: why was my creative rejected
    context: {screen: creative_library, role: CAMPAIGN_MANAGER}
    expect:
      capability: creative.explain_review_status
      mode: answer
      follow_up: null
      metrics: [creatives_rejected]
    why: >
      aiReasonCode and aiMessage say why. Reading them back is far more useful than
