  actions:
    - capability: wallet.request_funds
      label: Top up
      mutating: true
      otp_gated: true
      gate: PERMISSION
      permission: TOPUP_WALLET
      genie_mode: navigate
      status: blocked
      blocked_by: [R6]
      blocked_note: >
        Shown on the CAMPAIGN_MANAGER variant, but PermissionBundles grants that role neither
        TOPUP_WALLET nor MARK_INVOICE_PAID. Either the bundle is wrong or the screen is.
        WalletOpenServiceImpl uses OtpGrpcClient, so Genie can never complete this regardless.

    - capability: invoice.settle
      label: Settle
      mutating: true
      otp_gated: true
      gate: UNKNOWN
      permission: MARK_INVOICE_PAID
      genie_mode: navigate
      status: blocked
      blocked_by: [R6]
      blocked_note: >
        Same as wallet.request_funds. Note MARK_INVOICE_PAID is one of the 8 permissions declared
        but never used in an @RequireAccess (FINDINGS.md F1) — the real gate must be read from the
        controller, not assumed.

