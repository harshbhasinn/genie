        - >
          R15 still holds for whoever does get this: four opaque bucket keys, now labelled 18-25, 26-35, 36-50 and 51+, rendered exactly as returned and never re-bucketed.
        - >
          PARTIAL ALTERNATIVE - /dashboard/content returns dwellByCohortZone, keyed '<ageBucket>|<gender>' such as '26-35|F'. That exposes the same demographic axes to an agency, but as DWELL SECONDS per cohort per zone, not as a share of people. It answers 'which cohorts engaged with my creatives', not 'who is in front of the screens'. It is also SPARSE: an absent pair means no data, never zero.
