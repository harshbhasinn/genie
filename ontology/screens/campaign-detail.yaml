screen:
  id: campaign_detail
  kind: screen
  title: Campaign Detail
  route: /campaign/{campaignId}
  audience: [AD_PARTNER_ADMIN, CAMPAIGN_MANAGER, BRAND_MANAGER]
  source_frame: "Agency Admin Dashboard (1.5).docx - Brand Management (image3), BROADCASTING CAMPAIGNS group"
  variants: [broadcasting, targeted]
  purpose: >
    How one campaign is delivering: pace against plan, spend against budget, where it is playing,
    when its audience is watching, and who that audience is. The richest screen in the product and
    the one most questions will be asked about.
  entities: [campaign, brand, creative, device]
  related_screens: [brand_management, creative_library, launch_campaign]

  filters:
    - id: city
      label: City
      default: "All cities"
      unset_means: Every city this campaign runs in
    - id: category
      label: Category
      default: "All types"
      unset_means: Every store category
    - id: daypart
      label: Day-part
      default: null
      options: [Morning, Afternoon, Evening, Night]
      unset_means: >
        Only the dayparts this campaign actually booked. Unbooked dayparts render greyed out and
        labelled "not sold".

  sections:
    - id: header
      label: Campaign header
      subtitle: "Name, id, delivery mode, status, flight, days remaining, percent delivered."
      metrics: [campaign_percent_delivered, campaign_active_screens, campaign_stores,
                campaign_verified_viewers_per_day, campaign_screen_uptime]
    - id: kpi_row
      label: Headline KPIs
      metrics: [campaign_impressions, campaign_reach, campaign_frequency, campaign_cpm,
                campaign_spend, campaign_verified_view_rate]
    - id: delivery_performance
      label: Delivery performance
      subtitle: "Daily series with a dashed projection. Cumulative / Daily toggle."
    - id: delivery_pacing
      label: Delivery & Pacing
      metrics: [campaign_percent_delivered, campaign_time_elapsed, campaign_projected_final]
    - id: performance_breakdown
      label: Performance breakdown
      subtitle: "By City / By Day-part / By Category / By Creative. Reflects active filters."
    - id: audience_watching
      label: When your audience is watching
      subtitle: "Hourly delivery across the sellable day."
    - id: audience_profile
      label: Audience Profile
      subtitle: "camera-measured, for this campaign"
      metrics: [campaign_audience_profile]

  metrics:

    - id: campaign_impressions
      source:
        api: "GET /api/v1/campaign-analytics/{campaignId}/impressions"
        method: GET
        scope_key: client_id
        field: "totalImpressions"
      label: Impressions
      definition: Ad-views this campaign has delivered.
      unit: count
      freshness: unknown
      user_notes:
        - "Impressions are playback events, not people. Reach is the de-duplicated person count."
      gotchas:
        - >
          API 2026-10-23 - served per campaign, with a per-day series (dailyImpressions). The only one of the three delivery reads that is a measurement; its freshness is not in the contract, so it stays pending until the backend states it.
        - "R18 - named 'Impressions' here, 'Impressions Delivered' / 'Total Daily Impressions' / 'Daily Impression' elsewhere."
      status: pending_verification

    - id: campaign_reach
      source:
        api: "GET /api/v1/campaign-analytics/{campaignId}/reach"
        method: GET
        scope_key: client_id
        field: "totalDeliverableReach"
      label: Reach
      definition: >
        People this campaign is booked to reach - the deliverable audience of its screens and
        time slots over the whole flight. A plan, not a count of people who saw the ad.
      unit: count
      freshness: live
      gotchas:
        - >
          API 2026-10-23 (API over design) - this is the PLAN, by the contract: the field is totalDeliverableReach and the response carries one flat dailyReach. Never say a campaign "reached" this many people; say it was booked to reach them. Confirm with the backend (asks/BACKEND-CHECKS.md).
        - >
          POLICY 2026-09-24 - resolved in favour of the API/backend over the design. See RESOLUTION-POLICY.md.
          Reach (best day) - ContentWindow.reach is max single-day distinct persons, not window-unique. Label it as such.
        - >
          The screen shows Impressions, Reach and Frequency together with reach = impressions /
          frequency - the same identity the Planner's reach model uses. Reassuring, but R12 still
          applies: four different reach concepts exist and only uniqueVisitors is window-unique.
      status: verified
      verified_against: "live QA BFF 2026-10-23 - endpoint answers 200 with this field, as an agency admin"

    - id: campaign_frequency
      label: Frequency
      definition: Average number of times a reached person saw this campaign.
      formula: "impressions / reach"
      unit: multiplier
      freshness: unknown
      gotchas:
        - >
          CampaignMetricsResponse returns four fields - campaignId, status, budget, totalScreens. It is a configuration read, not a delivery read. This metric was previously pointed at it, which asserted something the spec does not support.
        - >
          Frequency is impressions over reach, and neither is served per campaign, so the ratio is doubly unavailable.
        - >
          Frequency is a first-class product concept here, which validates the Planner's approach -
          S6 derives reach as impressions / avg_frequency from a curve fitted on person_day.
      status: blocked
      blocked_by: [R7]
      unavailable_note: "Frequency isn't available per campaign: it needs measured reach, and the campaign's reach is its plan."
      blocked_note: >
        Frequency isn't available per campaign: it needs measured reach, and the campaign's reach is its plan.

    - id: campaign_cpm
      label: CPM
      definition: Price per 1,000 impressions for this campaign.
      unit: cpm_inr
      freshness: live
      gotchas:
        - >
          CampaignMetricsResponse returns four fields - campaignId, status, budget, totalScreens. It is a configuration read, not a delivery read. This metric was previously pointed at it, which asserted something the spec does not support.
        - >
          Impressions per campaign are now served, so CPM is spend over impressions per 1,000 - and GET /api/v1/campaign-analytics/{campaignId}/performance-breakdown returns cpm per row. Not wired in Genie yet.
      status: blocked
      blocked_by: [R7]
      unavailable_note: "CPM isn't reported per campaign yet."
      blocked_note: >
        CPM isn't reported per campaign yet.

    - id: campaign_spend
      source:
        api: "GET /api/v1/campaign-analytics/{campaignId}/spend"
        method: GET
        scope_key: client_id
        field: "spendForRange"
      label: Spend
      definition: >
        The campaign's cost spread evenly over its days, up to today - what the schedule has
        used, not a measure of plays. Equals the whole cost once the campaign has ended.
      unit: currency_inr
      freshness: live
      gotchas:
        - >
          API 2026-10-23 (API over design) - this is the SCHEDULE, by the contract: the response carries one flat dailySpend alongside totalCost. Say "cost", never "spent". Confirm with the backend (asks/BACKEND-CHECKS.md).
        - >
          totalCost is what was COMMITTED; spendForRange is the even share of it up to the window's end. Neither is consumption by plays.
        - >
          For a broadcast campaign the wallet was debited in full at confirm (base + 18% GST), so
          "spend" here is delivery-weighted consumption, not a cash movement. Targeted campaigns are
          postpaid and accrue per impression.
      status: verified
      verified_against: "live QA BFF 2026-10-23 - endpoint answers 200 with this field, as an agency admin"

    - id: campaign_verified_view_rate
      label: Verified view rate
      unit: percent
      camera_measured: true
      freshness: batch_6h
      gotchas:
        - >
          ContentWindowResponse carries impressions and totalViews, but nothing states that totalViews is the camera-confirmed subset. The same gap as verified_impressions on the Command Centre.
        - >
          POLICY 2026-09-24 - resolved in favour of the API/backend over the design. See RESOLUTION-POLICY.md.
          A SHARE of impressions confirmed seen. Distinct from 'verified viewers', which is a count.
        - >
          R16 - three "verified" terms exist: "Verified Impressions" on the Command Centre (a share
          of impressions), "Verified view rate" here, and "verified viewers/day" in this screen's own
          header (a count of people). At minimum a share and a count are different units.
      status: blocked
      blocked_by: [R7]
      blocked_note: >
        No field returns a camera-confirmed count or share, at any scope.

    - id: campaign_verified_viewers_per_day
      label: Verified viewers / day
      unit: per_day
      camera_measured: true
      freshness: batch_6h
      gotchas:
        - >
          ContentWindowResponse carries impressions and totalViews, but nothing states that totalViews is the camera-confirmed subset. The same gap as verified_impressions on the Command Centre.
        - >
          POLICY 2026-09-24 - resolved in favour of the API/backend over the design. See RESOLUTION-POLICY.md.
          A COUNT of people. Distinct from 'verified view rate', which is a share.
      status: blocked
      blocked_by: [R7]
      blocked_note: >
        No field returns a camera-confirmed count or share, at any scope.

    - id: campaign_percent_delivered
      label: Percent delivered
      definition: Impressions delivered as a share of the plan.
      formula: "impressions delivered / planned impressions"
      unit: percent
      freshness: unknown
      gotchas:
        - >
          CampaignMetricsResponse returns four fields - campaignId, status, budget, totalScreens. It is a configuration read, not a delivery read. This metric was previously pointed at it, which asserted something the spec does not support.
        - >
          Needs delivered impressions against planned. Neither side is served per campaign.
      status: blocked
      blocked_by: [R7]
      unavailable_note: "Delivery against plan isn't available: nothing reports a campaign's planned impressions."
      blocked_note: >
        Delivery against plan isn't available: nothing reports a campaign's planned impressions.

    - id: campaign_time_elapsed
      source:
        api: "DERIVED - startDate and endDate from GET /api/v1/campaigns/{campaignId} against today"
        method: NONE
        scope_key: client_id
        field: "startDate, endDate"
      label: Time elapsed
      definition: Days elapsed as a share of the flight.
      formula: "days elapsed / total flight days"
      unit: percent
      freshness: live
      gotchas:
        - >
          Pure arithmetic on the campaign's own dates, so it works even while delivery is unserved. Pair it with percent-delivered only when that becomes available - elapsed time alone says nothing about pacing.
        - >
          PACING IS DEFINED BY THIS SCREEN. The panel states it plainly: "The marker shows time
          elapsed. Delivery tracking the marker = healthy pacing; ahead = burning fast; behind =
          under-delivering." Lift directly into the budget_pacing and underdelivery advisors.
        - >
          CRITICAL: a Targeted campaign chooses a pacing mode - Even or Accelerated. "Behind" is a
          defect under Even and the EXPECTED behaviour under Accelerated. The advisor must read
          campaign pacing before deciding anything is wrong.
      status: pending_verification

    - id: campaign_projected_final
      label: Projected final
      definition: Impressions this campaign is projected to finish on, at the current rate.
      unit: count
      freshness: unknown
      gotchas:
        - >
          CampaignMetricsResponse returns four fields - campaignId, status, budget, totalScreens. It is a configuration read, not a delivery read. This metric was previously pointed at it, which asserted something the spec does not support.
        - >
          A projection over a pacing curve that has no inputs.
      status: blocked
      blocked_by: [R7]
      unavailable_note: "A projected finish isn't available: nothing reports a campaign's planned impressions."
      blocked_note: >
        A projected finish isn't available: nothing reports a campaign's planned impressions.

    - id: campaign_active_screens
      source:
        api: "GET /api/v1/campaign-oversight/campaigns/{campaignId}/metrics"
        method: GET
        scope_key: client_id
        field: "totalScreens"
      label: Active screens
      unit: count
      freshness: unknown
      gotchas:
        - >
          R8 - 'Screens in use'. This is what the campaign booked, not what is powered on right now. For live status, the roster is the call.
        - >
          POLICY 2026-09-24 - resolved in favour of the API/backend over the design. See RESOLUTION-POLICY.md.
          Screens in use on this campaign - CampaignMetricsResponse.totalScreens.
      status: pending_verification

    - id: campaign_stores
      source:
        api: "GET /api/v1/campaigns"
        method: GET
        scope_key: client_id
        field: "campaigns[].scope.store"
      label: Stores
      definition: Distinct shops this campaign is playing in.
      unit: count
      freshness: unknown
      user_notes:
        - "A store is a shop; a screen is a device inside it. One store can hold several screens."
      gotchas:
        - >
          API 2026-10-23 - per campaign from GET /api/v1/campaigns, scope.store. Reported as returned.
        - >
          The campaign list's scope gives devices, store and cities per campaign. A store holds several screens, so the two are not interchangeable.
      status: pending_verification

    - id: campaign_screen_uptime
      source:
        api: "GET /api/v1/analytics/devices/{deviceId}/uptime"
        method: GET
        scope_key: client_id
        field: "summary, per device"
      definition: "Share of scheduled playtime this campaign's screens were up."
      unit: percent
      freshness: unknown
      label: Screen uptime
      gotchas:
        - >
          Per device only, so a campaign figure means fanning out across the campaign's screens and averaging. Genie says how many screens the average covers, or answers for one screen.
        - >
          POLICY 2026-09-24 - definition taken from the deck's annotation card, with the backend's vocabulary where they differ. See RESOLUTION-POLICY.md.
      status: pending_verification

    - id: campaign_audience_profile
      source:
        api: "GET /api/v1/campaign-analytics/{campaignId}/impressions/gender"
        method: GET
        scope_key: client_id
        field: "genders[].label, genders[].sharePct"
      label: Audience Profile
      definition: Gender and age mix of the people this campaign reached.
      unit: percent
      camera_measured: true
      freshness: batch_6h
      gotchas:
        - >
          POST /api/v1/dashboard/audience DOES return genderSplit and ageDistribution - but at CLIENT scope, across everything the agency runs. That answers 'who sees our ads', not 'who saw this campaign'. Genie may offer the agency-level figure, clearly labelled as the wider question.
        - >
          API 2026-10-23 (API over design) - GENDER is served per campaign, as a split of IMPRESSIONS (plays, not people). AGE is not served per campaign. Say both plainly.
        - >
          Age bands here are the design's five (18-24, 25-34, 35-44, 45-54, 55+); the analytics API
          returns AgeGroup keys since 2026-10-21 (18-24, 25-34, 35-44, 45-54, 55-64 and 65+). See R15.
      status: pending_verification

  actions:
    - capability: campaign.pause
      label: Pause campaign
      mutating: true
      otp_gated: true
      gate: PERMISSION
      permission: PAUSE_CAMPAIGN
      genie_mode: navigate
      status: verified
      verified_against: "CAMPAIGN_CREATION_GUIDE.md key rule 17 - pause needs an OTP"

    - capability: campaign.cancel
      label: Cancel campaign
      mutating: true
      otp_gated: true
      gate: PERMISSION
      permission: DELETE_CAMPAIGN
      roles: [AD_PARTNER_ADMIN, NETWORK_PARTNER_ADMIN]
      genie_mode: navigate
      status: verified
      verified_against: >
        CAMPAIGN_CREATION_GUIDE.md 2.3 - CAMPAIGN_MANAGER cannot cancel, lacks DELETE_CAMPAIGN.
        Key rule 19 - only SCHEDULED or LIVE campaigns can be cancelled.

    - capability: campaign.view_creatives
      label: Creatives
      mutating: false
      gate: PERMISSION
      permission: VIEW_CAMPAIGN
      genie_mode: navigate
      status: pending_verification

    - capability: campaign.view_map
      label: Map View
      mutating: false
      gate: PERMISSION
      permission: VIEW_CAMPAIGN
      genie_mode: navigate
      status: pending_transcription

  notes:
    - >
      THE DAYPART BANDS ON THIS SCREEN ARE CORRECT. "When your audience is watching" is subtitled
      "hourly delivery - 10AM-10PM" and bands Morning 10-1, Afternoon 1-4, Evening 4-7, Night 7-10,
      with Night marked "not sold". This matches the backend TimeSlots enum. The Command Centre's
      Daypart Occupancy chart is the one being corrected (D1).
    - >
      R17 - the header carries a blue "Broadcasted" badge beside a green "Live" badge. "Broadcasted"
      is the DELIVERY MODE (BROADCAST), not a status. Only "Live" is a status.
    - >
      The header also shows "Guaranteed - Broadcasting" and a "Payment Status" chip. Neither is yet
      traced to a backend field.
    - >
      Targeted campaigns render a different widget set - no screen counts, no daypart booking, and
      auction figures instead. Not yet transcribed.
