screen:
  id: brand_dashboard
  kind: screen
  title: Brand Overview
  route: /brand-overview
  nav_label: Overview
  audience: [BRAND_MANAGER]
  source_frame: "GENIE1.md section 3 (src/segments/non-premium/routes.ts) + section 2.2; originally Agency Admin Dashboard (1.5).docx, Brand Dashboard (image15)"
  purpose: >
    The landing tab of the Brand Manager's own read-only console. A brand's own people see their
    campaigns and their spend here; they do not get the partner console with pieces hidden.
  entities: [brand, campaign]
  related_screens: [brand_management, campaign_detail]

  notes:
    - >
      RESOLVED 2026-10-26 (R34). This screen's OPEN QUESTION - "is this a distinct screen, or the
      Campaign Manager's rendering of Brand Management?" - is answered by GENIE1.md section 3: it is
      neither. BRAND_MANAGER has a separate three-tab console (/brand-overview, /brand-campaigns,
      /brand-account) rendered by BrandConsoleTabs, with its own navigation. The Campaign Manager
      uses the ordinary /brand-management pages.
      It was modelled on /brand-management/{brandId}, which is Brand Management's own route - two
      screens on one route, so NAVIGATE had two different answers for one page.
    - >
      Still NOT TRANSCRIBED. Only the route, the audience and the shape of the console are known.
      Nothing reads metrics off this screen yet, and nothing should until someone sees it.
    - >
      Its two sibling tabs - /brand-campaigns and /brand-account - are real routes (they are in
      ontology/routes.yaml) and are not modelled as screens. A Brand Manager asking to be taken to
      either is currently unroutable, which is honest: we have never seen them.
    - >
      BRAND_MANAGER holds VIEW_CLIENT, VIEW_CAMPAIGN, VIEW_WALLET and VIEW_INVOICES and nothing
      else (GENIE1.md section 2, ROLE_PERMISSIONS), so this console carries no actions at all.
      Genie must not offer one here.
    - >
      Whatever it shows, the metric definitions will already exist in the other screen files -
      metrics are defined once and referenced, not redefined per screen.
