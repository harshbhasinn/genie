# OPTIONAL fallback. The default target is the QA pgvector on EC2, reached over
# an SSH tunnel — see README "Database". This exists for two narrow cases:
#
#   1. The tunnel is down and you want to keep working.
#   2. You are about to do something destructive enough that you would rather not
#      do it on the instance your partner is also using.
#
#   docker compose up -d
#   docker compose down          # stop, keep data
#   docker compose down -v       # stop, DROP the volume (full reset)
#
# Note the port: 5436, NOT 5435. The QA tunnel binds 5435 locally, and a container
# holding that port would stop the tunnel opening — which is a confusing failure,
# because the DSN would still connect, just to the wrong database.

services:
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: genie-pgvector
    restart: unless-stopped
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: genie
      POSTGRES_USER: genie
      # Local dev only. The real password lives in .env for the QA instance.
      POSTGRES_PASSWORD: genie_local_dev
    volumes:
      - genie_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genie -d genie"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Sessions and short-lived caches (GENIE_REDIS_URL). Port 6381, because 6379/6380 are
  # often taken by other local Redis containers. Nothing here needs to survive a
  # restart - every key has a TTL - so persistence is off. volatile-lru evicts only
  # keys that have a TTL, which is every key Genie writes.
  #   docker compose up -d redis
  #   GENIE_REDIS_URL=redis://:genie_local_dev@127.0.0.1:6381/0   (127.0.0.1, not localhost:
  #   on Windows localhost tries IPv6 first, and the port is bound to IPv4 only)
  redis:
    image: redis:7-alpine
    container_name: genie-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6381:6379"
    command: >
      redis-server --requirepass genie_local_dev --save "" --appendonly no
      --maxmemory 128mb --maxmemory-policy volatile-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "genie_local_dev", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  genie_pgdata:
